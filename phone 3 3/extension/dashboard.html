<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Reels Lead Finder</title>
<link rel="stylesheet" href="dashboard.css"></head><body>
<header><h1>Reels Lead Finder</h1><span id="conn" class="pill">offline</span><span id="run" class="pill">stopped</span><span id="screen" class="pill hide"></span></header>
<section class="bar">
  <button id="start" class="go">Start</button><button id="pause">Pause</button><button id="resume">Resume</button><button id="stop" class="stop">Stop</button>
  <label class="inl"><input type="checkbox" id="reset"> re-visit profiles already seen</label>
  <span class="sp"></span>
  <button id="test">Test phone</button><button id="diag">Download diagnostics</button>
</section>
<section id="reason" class="warn" hidden></section>
<section id="pf" class="pfbox" hidden></section>
<section class="counters">
  <div><b id="c-scanned">0</b><span>Reels scanned</span></div>
  <div><b id="c-visited">0</b><span>Profiles visited</span></div>
  <div class="m"><b id="c-match">0</b><span>Match</span></div>
  <div class="u"><b id="c-unc">0</b><span>Uncertain</span></div>
  <div class="r"><b id="c-rej">0</b><span>Rejected</span></div>
  <div class="w"><b id="c-wa">0</b><span>With WhatsApp</span></div>
  <div><b id="c-ctry">0</b><span>With country</span></div>
  <div><b id="c-dup">0</b><span>Duplicates</span></div>
  <div><b id="c-hour">0</b><span>Visits / hour</span></div>
</section>
<details id="settings"><summary>Settings</summary>
<form id="f">
  <label>Bridge URL<input name="bridgeUrl"></label>
  <label>Bridge token<input name="token" type="password" autocomplete="off"></label>
  <label>Niche (for AI check)<input name="niche" placeholder="home bakers, cookies, cakes"></label>
  <label>Keywords (comma separated; empty = niche)<input name="keywords" placeholder="cookie, cake, bake, dessert"></label>
  <label>Max followers<input name="maxFollowers" type="number" min="0"></label>
  <label>Min followers<input name="minFollowers" type="number" min="0"></label>
  <label>Max posts<input name="maxPosts" type="number" min="0"></label>
  <label>Keep only these countries (comma list, empty = all; unknown is always kept)<input name="countries" placeholder="India, Pakistan"></label>
  <label class="chk"><input name="requireContact" type="checkbox"> Only keep accounts with a public WhatsApp / phone / email</label>
  <label class="chk"><input name="fetchWhatsApp" type="checkbox"> Open WhatsApp links/buttons to read the real number (slower, more taps)</label>
  <label class="chk"><input name="fetchContact" type="checkbox"> Open "Contact info" sheet (phone, email, address)</label>
  <label class="chk"><input name="fetchCountry" type="checkbox"> Read country via ⋮ &gt; About this account</label>
  <label>Gemini API key (free tier, optional)<input name="geminiKey" type="password" autocomplete="off"></label>
  <label>Gemini model<input name="geminiModel"></label>
  <label>Max profile visits / hour<input name="profilesPerHour" type="number" min="1" max="120"></label>
  <label>Max profile visits / day<input name="dailyCap" type="number" min="1" max="1000"></label>
  <label>Seconds per Reel (min)<input name="dwellMin" type="number" min="2"></label>
  <label>Seconds per Reel (max)<input name="dwellMax" type="number" min="3"></label>
  <div class="row2"><button type="submit">Save settings</button> <button type="button" id="reclass">Re-apply filters to saved leads</button> <span id="saved"></span></div>
</form></details>

<h2>Leads <small id="count"></small></h2>
<section class="tools">
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">All</button><button data-f="Match">Match</button><button data-f="Uncertain">Uncertain</button><button data-f="Rejected">Rejected</button><button data-f="contact">Has contact</button><button data-f="wa">Has WhatsApp</button>
  </div>
  <input id="q" type="search" placeholder="Search username, bio, country, number…">
  <select id="sort"><option value="new">Newest</option><option value="followers">Followers ↓</option><option value="status">Status</option></select>
  <span class="sp"></span>
  <button id="copywa">Copy WhatsApp numbers</button><button id="csv">Export CSV</button><button id="xls">Export Excel</button><button id="clear" class="stop">Clear</button>
</section>
<div class="wrap"><table id="t"><thead><tr><th>Status</th><th>Account</th><th>Stats</th><th>Contact</th><th>Country</th><th>Why</th><th>Bio</th></tr></thead><tbody id="tb"></tbody></table>
<div id="empty" class="empty" hidden>No leads match this filter yet.</div></div>
<button id="more" class="more" hidden>Show more</button>
<h2>Log</h2><pre id="log"></pre>
<script src="dashboard.js"></script></body></html>
